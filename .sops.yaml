  # Private half of the peteches automation SSH keypair -- only ever
  # decrypted on claude-workstation, where peteches uses it as its own
  # outbound identity to reach the criticalgrind/ygo accounts (and, in
  # general, any other VM's peteches login) without borrowing a desktop's
  # admin key. See (peteches home modules claude-workstation) and
  # docs/secrets-management.org.
  - path_regex: secrets/hosts/claude-workstation/peteches-automation-ssh\.yaml$
    pgp: "5FFB7006A36B0AEDE8D08E3753B1E002546A642A"
    age: "age1gcrgp0sy04kdxuyn2rmkeknx32jvw55yku8v0mwyhypagds5z9jqz0h0z2"

  # Public half of the peteches automation SSH keypair. Its own
  # independently-growable recipient list (every VM's age key) rather than
  # the general secrets/shared/.*\.yaml$ rule below, since it must reach
  # every VM including several not in that list (claude-workstation,
  # concourse-*, plane). make-vm-os in peteches/systems/vm-base.scm
  # decrypts this unconditionally on every VM and wires it into sshd's
  # AuthorizedKeysFile for the peteches user (see #:automation-key-extra-
  # users for the additional criticalgrind/ygo grant on claude-workstation
  # only).
