platform: linux

image_resource:
  type: registry-image
  source:
    repository: hashicorp/terraform
    tag: "1.10"

inputs:
- name: repo-main
  path: repo

params:
  AWS_ACCESS_KEY_ID: ((minio_access_key))
  AWS_SECRET_ACCESS_KEY: ((minio_secret_key))
  UNIFI_API_KEY: ((unify_api_key))

run:
  path: sh
  args:
  - -ec
  - |
    cd repo/infra/unifi
    terraform init
    terraform plan