platform: linux

image_resource:
  type: registry-image
  source:
    repository: registry.ts.peteches.co.uk/critical-grind-ci
    tag: latest

inputs:
- name: app-repo

run:
  path: bash
  args:
  - -ce
  - |
    cd app-repo
    export PATH="$PATH:$(go env GOPATH)/bin"

    echo "=== gofmt ==="
    UNFORMATTED=$(gofmt -l .)
    if [ -n "$UNFORMATTED" ]; then
      echo "the following files are not gofmt'd:"
      echo "$UNFORMATTED"
      exit 1
    fi

    echo "=== go vet ==="
    go vet ./...

    echo "=== golangci-lint ==="
    golangci-lint run ./...

    echo "=== vendor-check ==="
    make vendor-check
