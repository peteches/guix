platform: linux

image_resource:
  type: registry-image
  source:
    repository: registry.ts.peteches.co.uk/critical-grind-ci
    tag: latest

inputs:
- name: app-repo

run:
  path: bash
  args:
  - -ce
  - |
    cd app-repo
    export PATH="$PATH:$(go env GOPATH)/bin"

    echo "=== gofmt ==="
    # This repo builds in vendor-consistency mode, so `go list ./...` walks
    # vendor/ too -- explicit path exclusion, matching .golangci.yml's own
    # exclusions, is the only way to skip third-party files this repo
    # doesn't own.
    UNFORMATTED=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*' -not -path './web/static/vendor/*'))
    if [ -n "$UNFORMATTED" ]; then
      echo "the following files are not gofmt'd:"
      echo "$UNFORMATTED"
      exit 1
    fi

    echo "=== go vet ==="
    go vet ./...

    echo "=== golangci-lint ==="
    golangci-lint run ./...

    echo "=== vendor-check ==="
    make vendor-check
