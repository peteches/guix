platform: linux

image_resource:
  type: registry-image
  source:
    repository: hashicorp/terraform
    tag: "1.10"

inputs:
- name: repo-main
  path: repo

params:
  AWS_ACCESS_KEY_ID: ((terraform.minio_access_key))
  AWS_SECRET_ACCESS_KEY: ((terraform.minio_secret_key))
  TF_VAR_proxmox_api_token: ((terraform.proxmox_api_token))
  PETECHES_SSH_PRIVATE_KEY: ((terraform.peteches_ssh_private_key))

run:
  path: sh
  args:
  - -ec
  - |
    mkdir -p /home/peteches/.ssh
    printf '%s' "$PETECHES_SSH_PRIVATE_KEY" > /home/peteches/.ssh/id_ed25519
    chmod 600 /home/peteches/.ssh/id_ed25519
    cd repo/infra/terraform
    terraform init

    # This job only runs because plan-main succeeded (it is gated on plan-main
    # via passed:). Re-plan and RE-CHECK the safety gate before applying —
    # defense in depth, since the plan could have drifted since plan-main ran.
    # If it would delete/replace anything, FAIL WITHOUT applying.
    terraform plan -out=tfplan
    if terraform show -json tfplan | grep -qE '"actions":\["delete"\]|"actions":\["delete","create"\]|"actions":\["create","delete"\]'; then
      echo "ERROR: plan includes DELETION/replacement of existing resources." >&2
      echo "       NOT applying. Review the plan manually before any targeted apply." >&2
      exit 1
    fi

    # Safe: apply the plan.
    echo "Applying plan (no deletions/replacements)…"
    terraform apply -auto-approve tfplan