platform: linux

image_resource:
  type: registry-image
  source:
    repository: hashicorp/terraform
    tag: "1.10"

inputs:
- name: repo-main
  path: repo

params:
  AWS_ACCESS_KEY_ID: ((terraform.minio_access_key))
  AWS_SECRET_ACCESS_KEY: ((terraform.minio_secret_key))
  TF_VAR_proxmox_api_token: ((terraform.proxmox_api_token))
  PETECHES_SSH_PRIVATE_KEY: ((terraform.peteches_ssh_private_key))

run:
  path: sh
  args:
  - -ec
  - |
    mkdir -p /home/peteches/.ssh
    printf '%s' "$PETECHES_SSH_PRIVATE_KEY" > /home/peteches/.ssh/id_ed25519
    chmod 600 /home/peteches/.ssh/id_ed25519
    cd repo/infra/terraform
    terraform init
    # PLAN-ONLY: never auto-apply the full root module. A full apply cannot
    # carry per-VM images, so any pending create would produce a blank shell
    # (the 2026-10-27 claude-workstation incident: node/identity drift planned
    # destroy+recreate of a live VM and the recreate had no image). Node
    # placement is now hardcoded per module in main.tf, so a full plan should
    # only ever show in-place drift. New or re-provisioned VMs go through the
    # per-VM provision jobs (targeted apply with the image) or a manual
    # targeted apply.
    terraform plan -out=tfplan
    # Refuse if the plan would delete anything — pure deletes or replaces.
    # Terraform's plan JSON names the action "delete" (never "destroy"), in
    # these forms: ["delete"], ["delete","create"], ["create","delete"].
    # Surface it as a failure so a human reviews before any targeted apply.
    if terraform show -json tfplan | grep -qE '"actions":\["delete"\]|"actions":\["delete","create"\]|"actions":\["create","delete"\]'; then
      echo "ERROR: plan includes DELETION of existing resources. Review manually before applying." >&2
      exit 1
    fi
    echo "Plan contains no destruction. If changes are wanted, apply manually:"
    echo "  terraform apply tfplan            (full, drift only)"
    echo "  terraform apply -target=module.<vm> tfplan   (per VM; image via TF_VAR_vm_image_files)"
