# herdr configuration generated by matugen — do not edit directly.
# Edit this template instead: configs/matugen/templates/herdr-config.toml
#
# herdr's config.toml has no include/import mechanism, so unlike the other
# matugen outputs in this repo (which are fragments an app includes on top
# of a static base config) this template renders herdr's ENTIRE config —
# keybinds and UI settings included, not just colours.

onboarding = false

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
accent = "{{colors.primary.default.hex}}"
panel_bg = "{{colors.surface_container.default.hex}}"
surface0 = "{{colors.surface_container.default.hex}}"
surface1 = "{{colors.surface_container_high.default.hex}}"
surface_dim = "{{colors.surface_dim.default.hex}}"
overlay0 = "{{colors.outline_variant.default.hex}}"
overlay1 = "{{colors.outline.default.hex}}"
text = "{{colors.on_surface.default.hex}}"
subtext0 = "{{colors.on_surface_variant.default.hex}}"
mauve = "{{colors.tertiary.default.hex}}"
green = "{{colors.secondary.default.hex}}"
yellow = "{{colors.tertiary_container.default.hex}}"
red = "{{colors.error.default.hex}}"
blue = "{{colors.primary.default.hex}}"
teal = "{{colors.secondary_container.default.hex}}"
peach = "{{colors.primary_container.default.hex}}"

[keys]
# Emacs-flavoured pane focus, replacing herdr's vim-like h/j/k/l defaults
# with Emacs windmove's shift+arrow convention. Arrow keys alone already
# always move focus in navigate mode regardless of these bindings, so the
# letter overrides there are disabled rather than remapped.
navigate_pane_left = ""
navigate_pane_down = ""
navigate_pane_up = ""
navigate_pane_right = ""
focus_pane_left = "shift+left"
focus_pane_down = "shift+down"
focus_pane_up = "shift+up"
focus_pane_right = "shift+right"
